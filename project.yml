name: NewPal
options:
  bundleIdPrefix: com.steveshi
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    ENABLE_APP_SANDBOX: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  NewPal:
    type: application
    platform: macOS
    sources:
      - path: Sources/Engine
      - path: Sources/App
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_NAME: NewPal
        PRODUCT_BUNDLE_IDENTIFIER: com.steveshi.newpal
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Engine/NewPal-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "/opt/homebrew/opt/sdl3/include"
          - "/opt/homebrew/opt/ffmpeg/include"
          - "$(SRCROOT)/Sources/Engine"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "/opt/homebrew/opt/sdl3/lib"
          - "/opt/homebrew/opt/ffmpeg/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lSDL3"
          - "-liconv"
          - "-lavformat"
          - "-lavcodec"
          - "-lswscale"
          - "-lswresample"
          - "-lavutil"
          - "-Wl,-rpath,/opt/homebrew/opt/sdl3/lib"
          - "-Wl,-rpath,/opt/homebrew/opt/ffmpeg/lib"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "ImageIO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PAL_ENABLE_TEST_MODE"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) PAL_ENABLE_TEST_MODE=1"
        OTHER_CFLAGS:
          - "-Wall"
          - "-Wextra"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © Steve Shi. Clean-Room Engine Only."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
